<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logbook Teknisi • Stasiun Geofisika Deli Serdang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .badge-normal { @apply bg-emerald-100 text-emerald-800; }
    .badge-perhatian { @apply bg-amber-100 text-amber-800; }
    .badge-rusak { @apply bg-red-100 text-red-800; }
    .badge-perbaikan { @apply bg-blue-100 text-blue-800; }
    
    /* Warna kuning-oranye untuk judul */
    .title-orange {
      color: #f59e0b; /* amber-500 */
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ====================== HEADER BARU ====================== -->
  <header class="bg-gradient-to-r from-green-800 via-green-700 to-green-600 text-white shadow-xl">
    <div class="max-w-6xl mx-auto px-4 py-6">
      
      <!-- Baris atas: Logo + Info -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
        <div class="flex items-center gap-3">
          <!-- Logo BMKG (ganti dengan URL logo resmi jika ada) -->
          <div class="bg-white rounded-full p-1.5 shadow-md">
            <img 
              src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Logo_BMKG.svg/200px-Logo_BMKG.svg.png" 
              alt="Logo BMKG" 
              class="w-12 h-12 object-contain"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >
            <!-- Fallback jika gambar gagal load -->
            <div class="w-12 h-12 bg-green-700 rounded-full hidden items-center justify-center text-white font-bold text-sm">
              BMKG
            </div>
          </div>
          <div>
            <p class="text-green-100 text-sm font-medium">Badan Meteorologi, Klimatologi, dan Geofisika</p>
            <p class="text-green-200 text-xs">Stasiun Geofisika Deli Serdang</p>
          </div>
        </div>

        <div class="text-right text-sm text-green-100">
          <div class="flex items-center gap-2 justify-end">
            <i class="fa-solid fa-cloud"></i>
            <span>Data tersimpan di cloud • Real-time</span>
          </div>
        </div>
      </div>

      <!-- Judul utama di tengah -->
      <div class="text-center py-2 border-t border-green-500/40">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wide title-orange flex items-center justify-center gap-3">
          <i class="fa-solid fa-book-journal-whills text-amber-400"></i>
          LOGBOOK TEKNISI
          <i class="fa-solid fa-book-journal-whills text-amber-400"></i>
        </h1>
        <p class="text-green-100 text-sm mt-1 tracking-wider">STASIUN GEOFISIKA DELI SERDANG</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-green-700"></i>
        Tambah Catatan Baru
      </h2>

      <form id="logForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium mb-1">Tanggal & Waktu</label>
          <input type="datetime-local" id="waktu" required
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none transition">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Nama Teknisi</label>
          <input type="text" id="teknisi" required placeholder="Contoh: Andi Pratama"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none transition">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Jenis Kegiatan</label>
          <select id="kegiatan" required
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none transition">
            <option value="">-- Pilih Kegiatan --</option>
            <option>Pemeriksaan Rutin Seismograf</option>
            <option>Kalibrasi Sensor</option>
            <option>Penggantian Komponen</option>
            <option>Pemeliharaan Jaringan Data</option>
            <option>Pemantauan Gempa / Tsunami</option>
            <option>Pembersihan Peralatan</option>
            <option>Lainnya</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Status Peralatan</label>
          <select id="status" required
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none transition">
            <option value="Normal">Normal / Baik</option>
            <option value="Perlu Perhatian">Perlu Perhatian</option>
            <option value="Rusak">Rusak / Tidak Berfungsi</option>
            <option value="Dalam Perbaikan">Dalam Perbaikan</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium mb-1">Catatan / Observasi</label>
          <textarea id="catatan" rows="3" required placeholder="Tuliskan detail pekerjaan, hasil pemeriksaan, atau masalah..."
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none transition"></textarea>
        </div>

        <div class="md:col-span-2 flex gap-3">
          <button type="submit"
            class="bg-green-700 hover:bg-green-800 text-white font-medium px-6 py-2.5 rounded-xl transition flex items-center gap-2">
            <i class="fa-solid fa-save"></i> Simpan Catatan
          </button>
          <button type="button" onclick="resetForm()"
            class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium px-5 py-2.5 rounded-xl transition">
            Reset
          </button>
        </div>
      </form>
    </div>

    <!-- Search + Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h2 class="text-lg font-semibold flex items-center gap-2">
          <i class="fa-solid fa-list text-green-700"></i>
          Daftar Logbook
        </h2>

        <div class="relative w-full sm:w-80">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="Cari teknisi, kegiatan, catatan..."
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-green-600 focus:border-green-600 outline-none transition text-sm">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-600">
            <tr>
              <th class="text-left py-3 px-4 font-medium">Waktu</th>
              <th class="text-left py-3 px-4 font-medium">Teknisi</th>
              <th class="text-left py-3 px-4 font-medium">Kegiatan</th>
              <th class="text-left py-3 px-4 font-medium">Status</th>
              <th class="text-left py-3 px-4 font-medium">Catatan</th>
              <th class="text-left py-3 px-4 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody id="logBody" class="divide-y divide-slate-100">
            <!-- data akan diisi JS -->
          </tbody>
        </table>
      </div>

      <div id="emptyState" class="hidden py-16 text-center text-slate-400">
        <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
        <p>Belum ada data logbook</p>
      </div>
    </div>
  </main>

  <script>
  // ====================== KONFIGURASI SUPABASE ======================
  const SUPABASE_URL = 'https://jqbevbetdobpshoaglbm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxYmV2YmV0ZG9icHNob2FnbGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Mzg5OTcsImV4cCI6MjEwMzQxNDk5N30.Fw9rhNrJPxFMNqukc5mRVlX5ZKPnwdAz5ax50p_qLgg';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ========== PENGATURAN ADMIN ==========
  // Ganti password admin di sini
  const ADMIN_PASSWORD = 'bmkg2024';   // ← Ganti sesuai keinginan

  document.getElementById('waktu').value = new Date().toISOString().slice(0, 16);

  let allLogs = [];

  // Load data dari database
  async function loadLogs() {
    const { data, error } = await supabaseClient
      .from('logbook')
      .select('*')
      .order('waktu', { ascending: false });

    if (error) {
      console.error(error);
      alert('Gagal memuat data: ' + error.message);
      return;
    }

    allLogs = data || [];
    renderLogs(allLogs);
  }

  // Tampilkan data + filter pencarian
  function renderLogs(logs) {
    const tbody = document.getElementById('logBody');
    const empty = document.getElementById('emptyState');

    if (logs.length === 0) {
      tbody.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }

    empty.classList.add('hidden');

    tbody.innerHTML = logs.map(log => {
      const waktu = new Date(log.waktu).toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      let badgeClass = 'bg-slate-100 text-slate-700';
      if (log.status === 'Normal') badgeClass = 'bg-emerald-100 text-emerald-800';
      if (log.status === 'Perlu Perhatian') badgeClass = 'bg-amber-100 text-amber-800';
      if (log.status === 'Rusak') badgeClass = 'bg-red-100 text-red-800';
      if (log.status === 'Dalam Perbaikan') badgeClass = 'bg-blue-100 text-blue-800';

      return `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-4 whitespace-nowrap">${waktu}</td>
          <td class="py-3 px-4 font-medium">${log.teknisi}</td>
          <td class="py-3 px-4">${log.kegiatan}</td>
          <td class="py-3 px-4">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${badgeClass}">
              ${log.status}
            </span>
          </td>
          <td class="py-3 px-4 max-w-xs truncate" title="${log.catatan}">${log.catatan || '-'}</td>
          <td class="py-3 px-4">
            <button onclick="hapusLog(${log.id})"
              class="text-red-600 hover:text-red-800 text-sm font-medium flex items-center gap-1">
              <i class="fa-solid fa-trash"></i> Hapus
            </button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // Pencarian real-time
  document.getElementById('searchInput').addEventListener('input', function(e) {
    const keyword = e.target.value.toLowerCase().trim();

    if (!keyword) {
      renderLogs(allLogs);
      return;
    }

    const filtered = allLogs.filter(log =>
      log.teknisi.toLowerCase().includes(keyword) ||
      log.kegiatan.toLowerCase().includes(keyword) ||
      (log.catatan || '').toLowerCase().includes(keyword) ||
      log.status.toLowerCase().includes(keyword)
    );

    renderLogs(filtered);
  });

  // Submit form
  document.getElementById('logForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const newLog = {
      waktu: document.getElementById('waktu').value,
      teknisi: document.getElementById('teknisi').value.trim(),
      kegiatan: document.getElementById('kegiatan').value,
      status: document.getElementById('status').value,
      catatan: document.getElementById('catatan').value.trim()
    };

    const { error } = await supabaseClient.from('logbook').insert([newLog]);

    if (error) {
      alert('Gagal menyimpan: ' + error.message);
      return;
    }

    alert('Catatan berhasil disimpan!');
    resetForm();
    loadLogs();
  });

  // ========== HAPUS HANYA UNTUK ADMIN ==========
  async function hapusLog(id) {
    // Minta password admin
    const password = prompt('Masukkan password Admin untuk menghapus data:');

    if (password === null) return; // User klik Cancel

    if (password !== ADMIN_PASSWORD) {
      alert('Password salah! Hanya Admin yang boleh menghapus data.');
      return;
    }

    if (!confirm('Yakin ingin menghapus catatan ini?')) return;

    const { error } = await supabaseClient.from('logbook').delete().eq('id', id);

    if (error) {
      alert('Gagal menghapus: ' + error.message);
      return;
    }

    alert('Data berhasil dihapus.');
    loadLogs();
  }

  function resetForm() {
    document.getElementById('logForm').reset();
    document.getElementById('waktu').value = new Date().toISOString().slice(0, 16);
  }

  // Load saat halaman dibuka
  loadLogs();
  </script>
</body>
</html>
